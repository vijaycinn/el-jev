[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eljev"
version = "0.2.0"
description = "Fast typed-decision sidecar and Copilot CLI pre-turn hook on Azure AI Foundry Cohere, with auditable abstention."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
  { name = "Vijay Cinnakonda" }
]
dependencies = []

[project.urls]
Homepage = "https://github.com/vijaycinn/el-jev"

[project.scripts]
eljev = "eljev.cli:main"

[tool.setuptools.packages.find]
include = ["eljev*"]
