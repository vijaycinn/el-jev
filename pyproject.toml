[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eljev"
version = "0.1.0"
description = "A fast typed-decision sidecar with auditable abstention."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
  { name = "Vijay Cinnakonda" }
]
dependencies = []

[project.scripts]
eljev = "eljev.cli:main"

[tool.setuptools.packages.find]
include = ["eljev*"]
